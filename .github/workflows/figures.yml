name: Figuren-Fotos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: App starten und fotografieren
        run: |
          npx next start -H 127.0.0.1 -p 3000 &
          sleep 6
          node scripts/screenshot-figures.mjs
      - name: Fotos in den Zweig „fotos“ legen
        run: |
          mkdir fotos && mv figuren-*.png fotos/
          cd fotos
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          git init -q -b fotos
          git config user.name leocast-bot
          git config user.email leocast-bot@users.noreply.github.com
          git add -A && git commit -qm "Figuren-Fotos"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fotos
