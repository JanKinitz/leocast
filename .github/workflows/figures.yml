name: Figuren-Fotos

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: App starten und fotografieren
        run: |
          npx next start -H 127.0.0.1 -p 3000 &
          sleep 6
          node scripts/screenshot-figures.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: figuren
          path: figuren-*.png
