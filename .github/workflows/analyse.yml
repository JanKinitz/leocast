name: Folgen vorab analysieren

on:
  schedule:
    - cron: "17 */6 * * *" # alle 6 Stunden (läuft bis zu 5 Stunden, solange das Kontingent reicht)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zweig „markers“ vorbereiten
        run: |
          git config --global user.name "leocast-bot"
          git config --global user.email "leocast-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin markers >/dev/null; then
            git fetch origin markers
            git worktree add out origin/markers
          else
            git worktree add --orphan -b markers out
          fi
      - name: Analysieren und laufend veröffentlichen
        env:
          PUBLISH: "1"
        run: node scripts/analyse-all.mjs out
