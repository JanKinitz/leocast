# Prüft jeden Push: Abhängigkeiten installieren, Typen prüfen, bauen.
# Veröffentlicht wird automatisch durch Vercel (Git-Integration).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Typen prüfen
        run: npm run typecheck
      - name: Bauen
        run: npm run build
